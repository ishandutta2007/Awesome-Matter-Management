<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #334155;
      stroke-width: 0.5;
      opacity: 0.3;
    }
    .dynamic-wave {
      animation: float 6s ease-in-out infinite alternate;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(2deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Dynamic Background Elements (Kept in Background) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="#4f46e5" filter="url(#glow)" class="pulse-circle" />
    <circle cx="1050" cy="220" r="150" fill="#9333ea" filter="url(#glow)" class="pulse-circle" style="animation-delay: 1.5s;" />
  </g>

  <!-- Geometric Grid Background -->
  <g>
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="300" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="300" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Wave Element (Background Art) -->
  <path d="M-50,220 C300,160 500,280 800,200 C1000,150 1150,240 1250,210 L1250,350 L-50,350 Z" fill="#3b82f6" opacity="0.12" class="dynamic-wave" />
  <path d="M-50,240 C250,280 600,180 900,250 C1100,290 1200,200 1250,230 L1250,350 L-50,350 Z" fill="#8b5cf6" opacity="0.15" class="dynamic-wave" style="animation-delay: -3s;" />

  <!-- Scale / Gavel Legal Symbol Icon -->
  <g transform="translate(80, 75)" opacity="0.9">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M20 48 L50 48 M35 22 L35 48 M22 28 L48 28 M22 28 L15 40 A12 12 0 0 0 29 40 Z M48 28 L41 40 A12 12 0 0 0 55 40 Z" stroke="url(#textGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pill Tag -->
  <g transform="translate(170, 75)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <text x="110" y="18" text-anchor="middle" class="badge-text">⚖️ LEGAL OPERATIONS ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Guaranteed High Contrast & Visibility) -->
  <g transform="translate(170, 145)">
    <text x="0" y="0" class="title">Awesome Matter Management ⚖️</text>
  </g>

  <g transform="translate(170, 185)">
    <text x="0" y="0" class="subtitle">Curated SaaS Platforms, Spend Tracking &amp; Open-Source Legal Tech Software</text>
  </g>

  <!-- Decorative Bottom Accent Line -->
  <rect x="170" y="210" width="860" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Stat Pills / Micro Tags -->
  <g transform="translate(170, 232)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" />
    <text x="65" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">💼 Enterprise ELM</text>
  </g>

  <g transform="translate(310, 232)">
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#1e293b" />
    <text x="70" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">📊 Spend &amp; eBilling</text>
  </g>

  <g transform="translate(460, 232)">
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#1e293b" />
    <text x="70" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">🔓 Open-Source Tools</text>
  </g>
</svg>
